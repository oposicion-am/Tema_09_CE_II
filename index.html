<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Decreto 23/2018 - Fondo de Mejoras</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>

<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Decreto 23/2018: Fondo de Mejoras, Comisiones Territoriales de Mejoras y mejoras forestales en montes catalogados</h1>
      <p>12 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>

  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">

      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"q": "Según el Decreto 23/2018, el Fondo de Mejoras de los montes catalogados se define como un fondo:", "o": ["Público, de carácter extrapresupuestario y permanente, territorializado por provincias.", "Privado de las entidades locales titulares, gestionado por cada Diputación Provincial.", "Público, de carácter presupuestario y anual, territorializado por comarcas forestales.", "Público, de carácter extrapresupuestario y temporal, de ámbito regional único."], "c": 0, "w": "Art. 3.3: el Fondo de Mejoras es un fondo público y de carácter extrapresupuestario y permanente, administrado por la consejería competente en montes, y se territorializa por provincias.", "d": "Fácil"}, {"q": "De acuerdo con la Ley 3/2009 de Montes de Castilla y León, citada en el preámbulo del decreto, el porcentaje mínimo que debe ingresarse en el Fondo de Mejoras por los aprovechamientos extraordinarios derivados de incendios, plagas o vendavales es:", "o": ["El 25%.", "El 15%.", "El 30%.", "El 50%."], "c": 2, "w": "Preámbulo y art. 4.a): con carácter general se ingresa como mínimo el 15% (art. 38 Ley 43/2003), y el 30% en los aprovechamientos extraordinarios consecuencia de eventos catastróficos como incendios, plagas o vendavales.", "d": "Fácil"}, {"q": "En los montes catalogados propiedad de la Comunidad de Castilla y León, el decreto establece que:", "o": ["Se ingresará la totalidad de los ingresos en la cuenta tesorera de la Comunidad.", "Se efectuará una aportación suplementaria hasta alcanzar al menos el 50% de los importes respectivos.", "Se efectuará una aportación suplementaria hasta alcanzar al menos el 30% de los importes respectivos.", "Se ingresará el mismo porcentaje mínimo del 15%, sin aportaciones suplementarias."], "c": 1, "w": "Art. 4.b): en los montes catalogados propiedad de la Comunidad se efectuará una aportación suplementaria de forma que el porcentaje se incremente hasta alcanzar al menos el 50% de los importes respectivos.", "d": "Alto"}, {"q": "La parte de una indemnización por daños y perjuicios que NO corresponde a la función productora del monte:", "o": ["Se ingresa en un 30%, al asimilarse a los daños por eventos catastróficos.", "Se ingresa en su totalidad y queda vinculada a mejoras en el propio monte dañado.", "Se ingresa en el Fondo en el mismo porcentaje que los aprovechamientos y el resto corresponde a la entidad titular.", "Se ingresa en su totalidad en el Fondo de Mejoras y se aplica íntegramente a mejoras de interés forestal general."], "c": 3, "w": "Art. 4.c).2.º y art. 5.5: la totalidad de la indemnización que no corresponde a la función productora se ingresa en el Fondo y se aplica en su totalidad a mejoras de interés forestal general. A la parte productora solo se le aplica el porcentaje general (art. 4.c).1.º).", "d": "Alto"}, {"q": "¿A cuál de los siguientes destinos NO puede aplicarse el Fondo de Mejoras?", "o": ["A la contratación de personal en régimen laboral.", "A la redacción de proyectos técnicos y al servicio de dirección facultativa de las mejoras.", "A los costes de auditoría externa de la Comisión Territorial de Mejoras.", "A mejoras que beneficien conjuntamente a varios montes de una reserva regional de caza."], "c": 0, "w": "Art. 5.4: el Fondo no puede destinarse a la contratación de personal en régimen laboral ni al sostenimiento de personal, instalaciones o inmuebles de la consejería. Los proyectos y la dirección facultativa sí pueden sufragarse (art. 17.6), igual que la auditoría como gasto de funcionamiento (art. 14.2) y las mejoras conjuntas en reservas de caza (art. 5.6).", "d": "Medio"}, {"q": "La disposición de fondos de las cuentas de mejoras requiere:", "o": ["Firma del representante de la entidad titular y del jefe del servicio territorial.", "Doble firma mancomunada del jefe del servicio territorial y del titular de la unidad o área de gestión forestal de montes catalogados.", "Doble firma mancomunada del delegado territorial y del secretario de la Comisión.", "Firma única de la persona titular de la delegación territorial, como presidente de la Comisión."], "c": 1, "w": "Art. 7.3: la disposición se autoriza mediante doble firma mancomunada: la primera, del titular de la jefatura del servicio territorial; la segunda, del titular de la unidad o área competente en gestión forestal de montes catalogados. Ambos pueden designar suplentes.", "d": "Medio"}, {"q": "Para realizar un trasvase de fondos entre dos montes catalogados de distintas entidades titulares, con el fin de abordar mejoras en un monte sin saldo suficiente, se requiere:", "o": ["El previo acuerdo de las entidades titulares, sin intervención de la Administración.", "Únicamente el acuerdo de la Comisión Territorial de Mejoras.", "El previo acuerdo entre las entidades titulares y la conformidad del servicio territorial.", "La resolución de la dirección general, a propuesta del servicio territorial."], "c": 2, "w": "Art. 8.4: es necesario el previo acuerdo entre las entidades titulares (todas ellas si la titularidad es compartida) y, además, la conformidad del servicio territorial. Esta conformidad solo se dispensa cuando la titularidad corresponde a las mismas entidades o conjuntos de ellas.", "d": "Alto"}, {"q": "En un aprovechamiento sometido al régimen de liquidación final, si el titular no abona las cuantías del Fondo de Mejoras conforme a las liquidaciones que se van practicando, el servicio territorial podrá:", "o": ["Declarar la caducidad de la licencia y adjudicar el lote al siguiente licitador.", "Iniciar directamente la vía de apremio, sin poder paralizar el aprovechamiento.", "Disponer la paralización del aprovechamiento y la prohibición de extracción de nuevos productos.", "Incautar la garantía técnica e integrarla en el Fondo de Mejoras, sin otra medida."], "c": 2, "w": "Art. 9.3: en los aprovechamientos con liquidación final, el servicio territorial puede disponer la paralización del aprovechamiento y prohibir la extracción de nuevos productos mientras no se abonen las cuantías según las liquidaciones practicadas.", "d": "Alto"}, {"q": "La Presidencia de la Comisión Territorial de Mejoras corresponde a:", "o": ["El representante de la entidad titular con mayor superficie de montes catalogados.", "La persona titular de la jefatura del servicio territorial competente en montes.", "La persona titular de la dirección general competente en montes.", "La persona titular de la delegación territorial de la Junta de Castilla y León."], "c": 3, "w": "Art. 11.1.a): la Presidencia corresponde al titular de la delegación territorial. La Vicepresidencia corresponde al titular de la jefatura del servicio territorial competente en montes (art. 11.1.b).", "d": "Fácil"}, {"q": "La parte del Fondo de Mejoras destinada a los gastos de funcionamiento de cada Comisión Territorial de Mejoras:", "o": ["No podrá exceder del 10% de los ingresos.", "No podrá exceder del 15% de los ingresos.", "La fija libremente la Comisión cada año, sin límite.", "No podrá exceder del 5% de los ingresos."], "c": 3, "w": "Art. 14.1: de acuerdo con el art. 108 de la Ley 3/2009, para los gastos de funcionamiento de cada Comisión se destina una parte que no puede exceder del 5% de los ingresos. Se aplica igual sobre los ingresos de cada monte de la provincia (art. 14.3).", "d": "Fácil"}, {"q": "Cuando el servicio territorial comunica a las entidades titulares las propuestas de mejoras para el Plan Anual, estas disponen de un plazo para presentar alegaciones o nuevas propuestas de:", "o": ["10 días; si no presentan alegaciones, se entiende que prestan su conformidad.", "15 días; si no presentan alegaciones, se entiende que las rechazan.", "10 días; si no presentan alegaciones, el servicio territorial debe requerirlas de nuevo.", "Un mes; si no presentan alegaciones, decide la Comisión."], "c": 0, "w": "Art. 16.3: antes del 20 de febrero el servicio territorial comunica a las entidades el extracto de cuentas y las propuestas de mejoras, y les concede 10 días para alegar. Pasado el plazo sin alegaciones, se entiende que la entidad presta su conformidad.", "d": "Medio"}, {"q": "Cuando la ejecución de una mejora corresponde a la entidad titular del monte, esta debe comunicar al servicio territorial la previsión de su inicio con una antelación mínima de:", "o": ["15 días.", "10 días.", "5 días.", "Un mes."], "c": 1, "w": "Art. 19.2: para facilitar la inspección, la entidad titular que ejecuta las mejoras debe comunicar al servicio territorial la previsión de inicio con al menos 10 días de antelación. La dirección e inspección corresponden siempre al servicio territorial (art. 19.1).", "d": "Medio"}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); m.textContent = "Copiado. Pégalo en Word."; }catch(e2){ m.textContent = "Selecciona el texto y copia con Ctrl+C."; }
    s.removeAllRanges();
  }
}
function downloadDoc(){
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}</style></head><body>'+document.getElementById("wordbody").innerHTML+'</body></html>';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
  a.download = "Test_Decreto_23_2018_Fondo_Mejoras.doc"; document.body.appendChild(a); a.click(); a.remove();
}
